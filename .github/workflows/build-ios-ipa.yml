name: Build unsigned iOS IPA (BC fallback)

# Fork-only workflow. Builds Theft4 for iPhoneOS arm64 on a hosted macOS runner,
# applies theft4-bc-fallback.patch (BC1/BC2/BC3 -> RGBA8 fallback for GPUs
# without Vulkan BC support, e.g. A16), and uploads an UNSIGNED .ipa as an
# Actions artifact. Re-sign it on-device with SideStore.
#
# Run it from the Actions tab -> "Build unsigned iOS IPA (BC fallback)" ->
# "Run workflow". If the compile hits the time budget, the compiler cache is
# saved and you simply press "Run workflow" again; it resumes from the cache.
#
# Contains no GTA IV game files. Never runs on the upstream repository.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned XeniOS revision providing the public iOS MoltenVK static archives.
  XENIOS_REPO: https://github.com/xenios-jp/XeniOS.git
  XENIOS_SHA: 87b176a078c316fde3adf67a217f0c44615b0e0d
  PATCH_FILE: theft4-bc-fallback.patch

jobs:
  build:
    name: iOS arm64 Release IPA
    if: github.repository != 'KoreanSeats1/Theft4'
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$XCODE" ]]; then XCODE=/Applications/Xcode.app; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          cmake --version
          python3 --version

      - name: Install ccache
        run: |
          brew install ccache
          ccache --version | head -n 1

      - name: Initialize pinned dependencies
        run: python3 tools/setup_repo.py

      - name: Apply BC1/BC2/BC3 -> RGBA8 fallback patch
        run: |
          set -euo pipefail
          if [[ -f glue/rexglue-sdk-main/src/graphics/gta4_native/bc_rgba8_fallback.h ]]; then
            echo "Fallback already present in this checkout; not applying the patch."
          else
            if [[ ! -f "$PATCH_FILE" ]]; then
              echo "::error::$PATCH_FILE is missing from the repository root. Upload it and re-run."
              exit 1
            fi
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
          fi
          test -f glue/rexglue-sdk-main/src/graphics/gta4_native/bc_rgba8_fallback.h
          grep -q "DecodeBcMipsToRgba8" glue/rexglue-sdk-main/src/graphics/gta4_native/graphics_system.cpp
          grep -q "texturedsp.c" glue/rexglue-sdk-main/thirdparty/CMakeLists.txt
          echo "Fallback source present."

      - name: Fetch XeniOS (MoltenVK sources)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/xenios-deps/XeniOS"
          cd "$GITHUB_WORKSPACE/xenios-deps/XeniOS"
          git init -q
          git remote add origin "$XENIOS_REPO"
          git fetch -q --depth 1 origin "$XENIOS_SHA"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8
          echo "XENIOS_ROOT=$(pwd)" >> "$GITHUB_ENV"

      - name: Restore MoltenVK archive cache
        id: mvk-cache
        uses: actions/cache@v4
        with:
          path: xenios-deps/XeniOS/build-ios-xcode/obj
          key: mvk-ios-${{ env.XENIOS_SHA }}-${{ runner.os }}-v1

      - name: Build iOS MoltenVK archives
        if: steps.mvk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cmake -S "$XENIOS_ROOT" -B "$XENIOS_ROOT/build-ios-xcode" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DXENIA_ENABLE_IOS_MOLTENVK=ON
          cmake --build "$XENIOS_ROOT/build-ios-xcode" --config Release \
            --target MoltenVK MoltenVK_Common MoltenVK_ShaderConverter \
                     spirv-cross SPIRV-Tools-static --parallel 3

      - name: Locate and verify MoltenVK archives
        run: |
          set -euo pipefail
          LIB_DIR="$XENIOS_ROOT/build-ios-xcode/obj/iOS/Release"
          for lib in libMoltenVK.a libMoltenVK_ShaderConverter.a libMoltenVK_Common.a \
                     libspirv-cross.a libSPIRV-Tools.a; do
            if [[ ! -f "$LIB_DIR/$lib" ]]; then
              echo "::error::Missing $LIB_DIR/$lib"
              find "$XENIOS_ROOT/build-ios-xcode" -name '*.a' | head -50
              exit 1
            fi
            lipo -archs "$LIB_DIR/$lib"
          done
          echo "THEFT4_MOLTENVK_IOS_LIB_DIR=$LIB_DIR" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-theft4-ios-${{ github.run_id }}
          restore-keys: |
            ccache-theft4-ios-

      - name: Configure Theft4 (iOS arm64 Release, unsigned)
        run: |
          set -euo pipefail
          export CCACHE_DIR="$HOME/Library/Caches/ccache"
          export CCACHE_MAXSIZE=6G
          ccache --zero-stats
          SHADER_DIR="$(cd "$THEFT4_MOLTENVK_IOS_LIB_DIR/../../.." && pwd)/generated"
          cmake --preset ios-device-release \
            -DREXGLUE_RUNTIME_ONLY=ON \
            -DREXGLUE_HEADLESS_KERNEL=ON \
            -DTHEFT4_BUILD_GAME_CODE=ON \
            -DTHEFT4_ENABLE_GAME_STARTUP=ON \
            -DTHEFT4_COMPILE_GTA4_NATIVE_BACKEND=ON \
            -DTHEFT4_ENABLE_GTA4_NATIVE_BACKEND=ON \
            -DTHEFT4_SIGN_DEVICE=OFF \
            -DTHEFT4_PUBLIC_BUILD=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTHEFT4_XENIOS_IOS_LIB_DIR="$THEFT4_MOLTENVK_IOS_LIB_DIR" \
            -DTHEFT4_XENIOS_GENERATED_SHADER_DIR="$SHADER_DIR"

      # The generated GTA IV AOT sources are ~5.8M lines. The step is capped
      # below the 6 h job limit so the cache can still be saved; on a cap hit
      # just run the workflow again.
      - name: Build Theft4
        id: build
        continue-on-error: true
        timeout-minutes: 300
        run: |
          set -euo pipefail
          export CCACHE_DIR="$HOME/Library/Caches/ccache"
          export CCACHE_MAXSIZE=6G
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_SLOPPINESS=time_macros,pch_defines
          cmake --build --preset theft4-device-release --parallel 3

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-theft4-ios-${{ github.run_id }}

      - name: Report incomplete build
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::Build did not finish (time cap or compiler error). If the log shows no compiler error, the compiler cache was saved: run this workflow again to resume."
          exit 1

      - name: Verify release compiler flags
        run: python3 tests/ios/verify_release_build.py out/build/ios-device-release

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          chmod +x tools/package_ios_ipa.sh
          ./tools/package_ios_ipa.sh \
            out/build/ios-device-release/theft4/Release/Theft4.app dist
          ls -la dist

      - name: Verify the IPA contains the BC fallback
        run: |
          set -euo pipefail
          IPA="$(ls dist/*.ipa | head -n 1)"
          rm -rf verify && mkdir verify && cd verify
          unzip -q "../$IPA"
          BIN="Payload/Theft4.app/Theft4"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -qw arm64
          # Strings that exist only with the fallback compiled in.
          if strings -a "$BIN" | grep -q -- "RGBA8 fallback"; then
            echo "found: RGBA8 fallback log string"
          else
            echo "::warning::RGBA8 fallback log string not found (log call may be compiled out)"
          fi
          for needle in "bc-fallback-layout" "bc-fallback-mip"; do
            if strings -a "$BIN" | grep -q -- "$needle"; then
              echo "found: $needle"
            else
              echo "::error::'$needle' not found in the built binary"
              exit 1
            fi
          done
          # The decoder itself must be linked in.
          if nm -a "$BIN" 2>/dev/null | grep -qi "ff_texturedsp_init"; then
            echo "found symbol: ff_texturedsp_init"
          else
            echo "::warning::ff_texturedsp_init symbol not visible (binary may be stripped)"
          fi
          # No game files may be bundled.
          if find Payload -iname 'default.xex*' -o -iname '*.rpf' | grep -q .; then
            echo "::error::Game files found in bundle"; exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-ios-arm64-bc-fallback-${{ github.run_number }}
          path: |
            dist/*.ipa
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
